name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 配置缓存跨 run 持久化：构建脚本未变时复用，显著缩短后续 run 的配置阶段
      - name: Cache Gradle configuration cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/configuration-cache
          key: gradle-config-cache-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', 'gradle.properties', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-config-cache-

      - name: Build debug APK, run unit tests, lint and generate coverage report
        timeout-minutes: 60
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:jacocoTestReport :app:jacocoTestCoverageVerification -PexcludeExtendedUiTests

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/
          if-no-files-found: warn

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ github.sha }}
          path: app/build/reports/jacoco/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/

  android-test:
    name: Instrumented Tests (Emulator)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # 配置缓存跨 run 持久化：构建脚本未变时复用，显著缩短后续 run 的配置阶段
      - name: Cache Gradle configuration cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/configuration-cache
          key: gradle-config-cache-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', 'gradle.properties', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-config-cache-

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          # Test image avoids first-run Google UI surfaces stealing Espresso focus.
          target: google_atd
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          script: bash .github/scripts/retry-instrumented-tests.sh

      - name: Upload androidTest reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: androidtest-reports
          path: app/build/reports/androidTests/

  beta:
    name: Build Beta Channel
    runs-on: ubuntu-latest
    needs: [build, android-test]
    outputs:
      published: ${{ steps.publication.outputs.published }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # The archive is mutable, so concurrent master pushes must update it in order.
    concurrency:
      group: qr-code-simple-beta-archive
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 配置缓存跨 run 持久化：构建脚本未变时复用，显著缩短后续 run 的配置阶段
      - name: Cache Gradle configuration cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/configuration-cache
          key: gradle-config-cache-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', 'gradle.properties', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-config-cache-

      - name: Configure matching release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ] && [ -z "${KEYSTORE_PASSWORD}" ] && [ -z "${KEYSTORE_ALIAS}" ]; then
            echo "No release-signing secrets configured; using app/debug.keystore for the matching release-signed Beta APK."
          elif [ -z "${KEYSTORE_BASE64}" ] || [ -z "${KEYSTORE_PASSWORD}" ] || [ -z "${KEYSTORE_ALIAS}" ]; then
            echo "RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, and RELEASE_KEYSTORE_ALIAS must be configured together." >&2
            exit 1
          else
            printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.keystore"
            test -s "${RUNNER_TEMP}/release.keystore"
            chmod 600 "${RUNNER_TEMP}/release.keystore"
            debug_cert_sha256="$(keytool -exportcert -keystore app/debug.keystore -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f1)"
            release_cert_sha256="$(keytool -exportcert -keystore "${RUNNER_TEMP}/release.keystore" -storepass "${KEYSTORE_PASSWORD}" -alias "${KEYSTORE_ALIAS}" | sha256sum | cut -d ' ' -f1)"
            if [ "${debug_cert_sha256}" != "${release_cert_sha256}" ]; then
              echo "Configured release keystore does not match app/debug.keystore; refusing to publish an incompatible Beta APK." >&2
              exit 1
            fi
            echo "RELEASE_KEYSTORE_FILE=${RUNNER_TEMP}/release.keystore" >> "${GITHUB_ENV}"
          fi

      - name: Build signed beta APK and write version info
        timeout-minutes: 60
        run: ./gradlew --no-daemon :app:assembleRelease :app:writeVersionInfo
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}

      - name: Confirm beta commit is still the master tip
        id: master_tip
        run: |
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/master)" ]; then
            echo "is_current=true" >> "${GITHUB_OUTPUT}"
          else
            echo "is_current=false" >> "${GITHUB_OUTPUT}"
            echo "Skipping stale beta commit ${GITHUB_SHA}; master has advanced."
          fi

      # ========== ApkDiffPatch 增量补丁（v1.8.1，字节一致性需 apksigner 34）==========
      - name: Install ApkDiffPatch toolchain
        if: steps.master_tip.outputs.is_current == 'true'
        run: |
          mkdir -p apkdiff && cd apkdiff
          gh release download v1.8.1 -R sisong/ApkDiffPatch -p '*bin_linux64*' --clobber
          unzip -o -q ApkDiffPatch_v1.8.1_bin_linux64.zip
          mv -f linux64/ApkNormalized linux64/ZipDiff linux64/ZipPatch ./
          chmod +x ApkNormalized ZipDiff ZipPatch
          echo "APKDIFF_BIN=$PWD" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # apksigner v35+ 会往首个 entry 插 padding extra field，ZipPatch 不还原 → 字节不一致
      # → 签名失效（上游 issue #96/#107）。必须钉 build-tools 34.0.0，绝不能升级。
      - name: Ensure apksigner 34
        if: steps.master_tip.outputs.is_current == 'true'
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" >/dev/null 2>&1 || true
          fi
          if [ ! -x "$APKSIGNER" ]; then
            echo "::warning::build-tools 34.0.0 不可用：本次 beta 仅全量，跳过增量补丁"
            echo "APKSIGNER_OK=0" >> "$GITHUB_ENV"
          else
            echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"
            echo "APKSIGNER_OK=1" >> "$GITHUB_ENV"
          fi

      # 发布物 = ApkNormalized（确定性打包）+ apksigner34 重签。这是客户端实际安装的字节，
      # apkSha256 必须对它计算。apksigner34 缺失时回退发布 AGP 签名原包（仍可安装，只是无增量）。
      - name: Normalize and re-sign beta APK
        if: steps.master_tip.outputs.is_current == 'true'
        run: |
          KEYSTORE="${RELEASE_KEYSTORE_FILE:-app/debug.keystore}"
          PASSWORD="${RELEASE_KEYSTORE_PASSWORD:-android}"
          ALIAS="${RELEASE_KEYSTORE_ALIAS:-androiddebugkey}"
          if [ "${APKSIGNER_OK:-0}" = "1" ]; then
            "$APKDIFF_BIN/ApkNormalized" app/build/outputs/apk/release/app-release.apk app-normalized.apk
            "$APKSIGNER" sign --ks "$KEYSTORE" --ks-pass "pass:${PASSWORD}" --key-pass "pass:${PASSWORD}" \
              --ks-key-alias "$ALIAS" \
              --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
              --out app-published.apk app-normalized.apk
          else
            cp app/build/outputs/apk/release/app-release.apk app-published.apk
          fi
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}

      - name: Prepare beta channel files
        if: steps.master_tip.outputs.is_current == 'true'
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          def digest(path):
              value = hashlib.sha256()
              with path.open("rb") as source:
                  for chunk in iter(lambda: source.read(1024 * 1024), b""):
                      value.update(chunk)
              return value.hexdigest()

          info = json.loads(Path("app/build/generated/version-info/version.json").read_text(encoding="utf-8"))
          code = info.get("versionCode")
          name = info.get("versionName")
          git_hash = info.get("gitHash")
          if type(code) is not int or code <= 0 or not isinstance(name, str) or name.startswith("v"):
              raise SystemExit("Gradle version-info contains an invalid versionCode or versionName")
          if not isinstance(git_hash, str) or len(git_hash) != 8:
              raise SystemExit("Gradle version-info must contain an 8-character gitHash")

          apk = Path("app-published.apk")
          if not apk.is_file():
              raise SystemExit("Signed release APK was not produced")
          beta_apk = Path("qr-code-simple-beta.apk")
          beta_apk.write_bytes(apk.read_bytes())

          tag = subprocess.run(
              ["git", "describe", "--tags", "--abbrev=0", "--match", "v*"],
              check=False, capture_output=True, text=True,
          ).stdout.strip()
          revision_range = f"{tag}..HEAD" if tag else "HEAD"
          changelog = subprocess.run(
              ["git", "log", "--format=%s", "--no-decorate", "-n", "20", revision_range],
              check=True, capture_output=True, text=True,
          ).stdout.strip()
          manifest = {
              "apkFile": beta_apk.name,
              "apkSha256": digest(beta_apk),
              "apkSize": beta_apk.stat().st_size,
              "changelog": changelog,
              "channel": "beta",
              "gitHash": git_hash,
              "versionCode": code,
              "versionName": name,
          }
          Path("version.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Generate optional beta delta chains
        if: steps.master_tip.outputs.is_current == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APKDIFF_BIN: ${{ env.APKDIFF_BIN }}
        run: python3 .github/scripts/build_beta_delta_chains.py

      - name: Validate beta metadata
        if: steps.master_tip.outputs.is_current == 'true'
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          apk = Path("qr-code-simple-beta.apk")
          metadata = json.loads(Path("version.json").read_text(encoding="utf-8"))
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          if metadata.get("apkFile") != apk.name or metadata.get("apkSha256") != digest:
              raise SystemExit("beta version.json does not describe the generated APK")
          if metadata.get("apkSize") != apk.stat().st_size:
              raise SystemExit("beta version.json does not contain the generated APK size")
          if type(metadata.get("versionCode")) is not int or not isinstance(metadata.get("versionName"), str):
              raise SystemExit("beta version.json is missing version metadata")
          PY

      - name: Upload beta channel artifact
        if: steps.master_tip.outputs.is_current == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: beta-channel-${{ github.sha }}
          path: |
            qr-code-simple-beta.apk
            version.json
            patch-beta-*.patch
          retention-days: 7
          if-no-files-found: error

      - name: Report beta publication state
        id: publication
        if: always()
        run: |
          if [ "${{ steps.master_tip.outputs.is_current }}" = "true" ]; then
            echo "published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "published=false" >> "${GITHUB_OUTPUT}"
          fi

  coverage-pages:
    name: Deploy Coverage Report to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build, beta]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.beta.outputs.published == 'true'
    concurrency:
      group: qr-code-simple-pages-deployment
      cancel-in-progress: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage-report

      - name: Download beta channel files
        uses: actions/download-artifact@v8
        with:
          name: beta-channel-${{ github.sha }}
          path: beta-channel

      - name: Generate coverage badge JSON
        run: |
          mkdir -p pages
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          xml_path = Path('coverage-report/html/jacocoTestReport.xml')
          if not xml_path.exists():
              xml_path = Path('coverage-report/jacocoTestReport.xml')
          if not xml_path.exists():
              raise FileNotFoundError('JaCoCo XML report not found')

          root = ET.parse(xml_path).getroot()
          pct = 0
          for counter in root.findall('counter'):
              if counter.get('type') == 'INSTRUCTION':
                  covered = int(counter.get('covered'))
                  missed = int(counter.get('missed'))
                  total = covered + missed
                  pct = round(covered / total * 100) if total > 0 else 0
                  break

          color = 'green' if pct >= 80 else 'yellow' if pct >= 60 else 'red'
          with open('pages/coverage.json', 'w') as f:
              json.dump({
                  'schemaVersion': 1,
                  'label': 'coverage',
                  'message': f'{pct}%',
                  'color': color
              }, f)
          PY

      - name: Prepare Pages content
        run: |
          cp -R coverage-report/html/* pages/
          mv pages/index.html pages/coverage.html
          # Remove any leftover index.html to keep the root slot free
          rm -f pages/index.html

      - name: Add beta channel to Pages
        run: |
          mkdir -p pages/beta
          cp beta-channel/version.json beta-channel/qr-code-simple-beta.apk pages/beta/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
