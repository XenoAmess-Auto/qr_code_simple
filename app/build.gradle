import groovy.json.JsonOutput
import org.gradle.api.GradleException

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'jacoco'
    id 'androidx.baselineprofile'
}

/**
 * Global test logger that prints START/END markers for every unit test.
 * Useful for identifying which test hangs in CI.
 */
class GlobalTestLogger implements org.gradle.api.tasks.testing.TestListener {
    void beforeSuite(org.gradle.api.tasks.testing.TestDescriptor suite) {}
    void afterSuite(org.gradle.api.tasks.testing.TestDescriptor suite, org.gradle.api.tasks.testing.TestResult result) {}
    void beforeTest(org.gradle.api.tasks.testing.TestDescriptor testDescriptor) {
        println("START TEST: ${testDescriptor.className} > ${testDescriptor.name}")
    }
    void afterTest(org.gradle.api.tasks.testing.TestDescriptor testDescriptor, org.gradle.api.tasks.testing.TestResult result) {
        println("END TEST: ${testDescriptor.className} > ${testDescriptor.name} (${result.resultType})")
    }
}

/**
 * Version identifiers are derived from the complete Git history so every build has a
 * monotonically increasing versionCode. A source archive or shallow checkout is not
 * sufficient: fail early with instructions instead of silently publishing bad metadata.
 */
def runGit = { List<String> arguments, boolean allowFailure = false ->
    def execution
    def result
    try {
        execution = providers.exec {
            workingDir rootProject.projectDir
            commandLine(*(['git'] + arguments))
            ignoreExitValue = true
        }
        result = execution.result.get()
    } catch (Exception e) {
        throw new GradleException(
                "Git-derived versioning requires the Git executable and a full repository. " +
                        "Clone the repository instead of building from a source archive.", e)
    }

    def commandResult = [
            exitValue: result.exitValue,
            output   : execution.standardOutput.asText.get().trim(),
            error    : execution.standardError.asText.get().trim()
    ]
    if (commandResult.exitValue != 0 && !allowFailure) {
        throw new GradleException(
                "Git command failed while deriving the Android version: git ${arguments.join(' ')}\n" +
                        "${commandResult.error}\n" +
                        "Use a full clone with history and tags (for example: git fetch --unshallow --tags).")
    }
    commandResult
}

def repositoryCheck = runGit(['rev-parse', '--is-inside-work-tree'], true)
if (repositoryCheck.exitValue != 0 || repositoryCheck.output != 'true') {
    throw new GradleException(
            "Git-derived versioning requires this build to run inside a Git repository. " +
                    "Clone the repository with Git metadata, then retry.")
}

def shallowCheck = runGit(['rev-parse', '--is-shallow-repository'])
if (shallowCheck.output == 'true') {
    throw new GradleException(
            "Git-derived versioning requires non-shallow history for versionCode. " +
                    "Run 'git fetch --unshallow --tags' (or clone with fetch-depth: 0) and retry.")
}

def versionCodeResult = runGit(['rev-list', '--count', 'HEAD'])
if (!(versionCodeResult.output ==~ /[1-9][0-9]*/)) {
    throw new GradleException("Git returned an invalid commit count for versionCode: '${versionCodeResult.output}'")
}
def gitVersionCode = versionCodeResult.output.toInteger()

def gitHashResult = runGit(['rev-parse', '--short=8', 'HEAD'])
if (!(gitHashResult.output ==~ /[0-9a-fA-F]{8,}/)) {
    throw new GradleException("Git returned an invalid hash for BuildConfig.GIT_HASH: '${gitHashResult.output}'")
}
def gitHash = gitHashResult.output.substring(0, 8)

def describeResult = runGit(['describe', '--tags', '--long', '--match', 'v*'], true)
def gitVersionName
if (describeResult.exitValue == 0) {
    def describeMatcher = describeResult.output =~ /^v(\d+\.\d+\.\d+)-(\d+)-g[0-9a-fA-F]+$/
    if (!describeMatcher.matches()) {
        throw new GradleException(
                "Nearest v* tag must use vMAJOR.MINOR.PATCH for Android versionName; " +
                        "got '${describeResult.output}'.")
    }
    def baseVersion = describeMatcher.group(1)
    def commitsAhead = describeMatcher.group(2).toInteger()
    gitVersionName = commitsAhead == 0 ? baseVersion : "${baseVersion}+${commitsAhead}"
} else {
    // The first build before any stable v* tag remains installable and identifiable.
    gitVersionName = "0.0.0+${gitVersionCode}"
}

def changelogAssetsDir = layout.buildDirectory.dir('generated/changelog/assets')
def changelogFile = changelogAssetsDir.map { it.file('CHANGELOG.txt') }
def versionInfoFile = layout.buildDirectory.file('generated/version-info/version.json')

jacoco {
    toolVersion = '0.8.12'
}

android {
    namespace 'com.xenoamess.qrcodesimple'
    compileSdk 35

    defaultConfig {
        applicationId "com.xenoamess.qrcodesimple"
        minSdk 28
        targetSdk 35
        versionCode gitVersionCode
        versionName gitVersionName
        buildConfigField "String", "GIT_HASH", "\"${gitHash}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Release 签名：优先取环境变量，其次 gradle 属性（如 ~/.gradle/gradle.properties）。
        // 未配置时 release 构建回退到 debug 签名，保证本地/外部贡献者构建可用。
        release {
            def ksFile = System.getenv("RELEASE_KEYSTORE_FILE") ?: (project.findProperty("RELEASE_KEYSTORE_FILE") as String)
            if (ksFile != null) {
                storeFile file(ksFile)
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD") ?: (project.findProperty("RELEASE_KEYSTORE_PASSWORD") as String)
                keyAlias System.getenv("RELEASE_KEYSTORE_ALIAS") ?: (project.findProperty("RELEASE_KEYSTORE_ALIAS") as String)
                keyPassword System.getenv("RELEASE_KEYSTORE_PASSWORD") ?: (project.findProperty("RELEASE_KEYSTORE_PASSWORD") as String)
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            // API 35 Google ATD tests run on x86_64; release remains ARM-only.
            ndk {
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            }
            testCoverage {
                enableUnitTestCoverage = false
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release.storeFile != null ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
        coreLibraryDesugaringEnabled false
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    sourceSets {
        main {
            assets.srcDir(changelogAssetsDir.get().asFile)
        }
    }
    lint {
        // 存量问题（主要是历史翻译债务）记录在 baseline 中；
        // 新增 issue（如新增未翻译字符串）会使 lintDebug 失败。
        baseline = file("lint-baseline.xml")
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                it.useJUnitPlatform()
                // 大位图测试（4000x4000+）在加载全部测试类后可能超出默认堆
                it.maxHeapSize = "2g"
                it.jacoco {
                    includeNoLocationClasses = true
                    excludes = ['jdk.internal.reflect.*']
                }
                it.filter {
                    if (project.hasProperty('excludeExtendedUiTests')) {
                        // 本地/CI 常规验证时排除长耗时测试：扩展 UI 测试 + 样式回扫矩阵
                        excludeTestsMatching '*GenerateFragmentExtendedUiTest*'
                        excludeTestsMatching '*StyleRawRoundtripMatrixTest*'
                    }
                }
                it.addTestListener(new GlobalTestLogger())
                testLogging {
                    showStandardStreams = true
                }
                systemProperty 'robolectric.logging', 'stdout'
            }
        }
    }
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libc++_shared.so']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.9'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    // Room Database
    def room_version = "2.7.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    // CameraX
    def camerax_version = "1.3.3"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"

    // OpenCV + WeChatQRCode
    implementation 'com.github.jenly1314.WeChatQRCode:opencv:2.6.0'
    implementation 'com.github.jenly1314.WeChatQRCode:opencv-armv7a:2.6.0'
    implementation 'com.github.jenly1314.WeChatQRCode:opencv-armv64:2.6.0'
    // Supplies libopencv_java4.so to the x86_64 Android Test Device only.
    debugImplementation 'com.github.jenly1314.WeChatQRCode:opencv-x86_64:2.6.0'
    implementation 'com.github.jenly1314.WeChatQRCode:wechat-qrcode:2.6.0'
    implementation 'com.github.jenly1314.WeChatQRCode:wechat-qrcode-scanning:2.6.0'

    // ZXing - 支持多种条形码格式
    implementation 'com.google.zxing:core:3.5.3'

    // ML Kit
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'
    implementation 'com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.1'

    // Flexbox Layout
    implementation 'com.google.android.flexbox:flexbox:3.0.0'

    // Apache Commons CSV
    implementation 'org.apache.commons:commons-csv:1.14.1'

    // Incremental APK update client: bsdiff implementation and its bzip2 support.
    implementation 'io.sigpipe:jbsdiff:1.0'
    implementation 'org.apache.commons:commons-compress:1.28.0'

    // Apache POI - Excel import for batch generation
    def poi_version = '5.5.1'
    implementation "org.apache.poi:poi:$poi_version"
    implementation "org.apache.poi:poi-ooxml:$poi_version"

    // Biometric
    implementation 'androidx.biometric:biometric:1.1.0'

    // SQLCipher - 数据库加密
    implementation 'net.zetetic:android-database-sqlcipher:4.5.4'
    implementation 'androidx.sqlite:sqlite:2.7.0'

    // EncryptedSharedPreferences - 安全存储数据库密钥
    implementation 'androidx.security:security-crypto:1.1.0'

    // ML Kit 传递依赖的 play-services-tasks / basement 高版本会在 Robolectric/CI 低核
    // 环境下留下非 daemon 线程导致测试 JVM 不退出。这里强制保持已知良好的旧版本。
    constraints {
        implementation('com.google.android.gms:play-services-tasks') {
            version {
                strictly '18.2.0'
                because 'prevent intermittent CI hang from non-daemon threads in play-services'
            }
        }
        implementation('com.google.android.gms:play-services-basement') {
            version {
                strictly '18.4.0'
                because 'prevent intermittent CI hang from non-daemon threads in play-services'
            }
        }
    }

    // BoofCV - Micro QR Code support
    implementation 'org.boofcv:boofcv-core:1.4.0'
    implementation 'org.boofcv:boofcv-android:1.4.0'

    // OkapiBarcode - RSS-14, RSS Expanded, MaxiCode generation
    implementation 'uk.org.okapibarcode:okapibarcode:0.5.6'

    // uCrop - image cropping for barcode styles
    implementation 'com.github.yalantis:ucrop:2.2.11'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation "org.jetbrains.kotlin:kotlin-test:$kotlin_version"
    // JUnit 5 Platform：现有 JUnit4/Robolectric 测试经 Vintage Engine 继续运行，
    // 新测试可使用 Jupiter 注解。JUnit 6 已移除 Vintage Engine，必须使用 5.x。
    def junit5_version = '6.1.2'
    testImplementation "org.junit.jupiter:junit-jupiter:$junit5_version"
    testRuntimeOnly "org.junit.vintage:junit-vintage-engine:$junit5_version"
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'androidx.test:runner:1.7.0'
    testImplementation 'androidx.test.ext:junit:1.3.0'
    testImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    testImplementation 'androidx.test.espresso:espresso-contrib:3.7.0'
    testImplementation 'androidx.fragment:fragment-testing:1.8.9'
    debugImplementation 'androidx.fragment:fragment-testing:1.8.9'

    // Instrumented tests (androidTest，模拟器/真机)
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.7.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    // fragment-testing 会把 androidx.test:core 1.5.0 带进 debug 运行时，
    // 与 androidTest 的 1.7.0 冲突；统一抬到 1.7.0（仅 debug 构建，不进 release）。
    debugImplementation 'androidx.test:core:1.7.0'

    // Baseline Profile 运行时安装器
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'
    baselineProfile project(':baselineprofile')
}

// Package release history with the app without mutating source assets.
tasks.register('generateChangelog') {
    outputs.file(changelogFile)
    // Git refs are external task inputs and can change without source changes.
    outputs.upToDateWhen { false }
    doLast {
        def outputFile = changelogFile.get().asFile
        outputFile.parentFile.mkdirs()

        def tagsResult = runGit(['tag', '-l', 'v*', '--sort=-creatordate'], true)
        def tags = tagsResult.exitValue == 0
                ? tagsResult.output.readLines().findAll { !it.trim().isEmpty() }
                : []
        if (tags.isEmpty()) {
            outputFile.setText('No matching v* tags are available in this repository.\n', 'UTF-8')
            return
        }

        def changelog = new StringBuilder()
        tags.eachWithIndex { String tag, int index ->
            def dateResult = runGit(['log', '-1', '--format=%cs', tag], true)
            def date = dateResult.exitValue == 0 && dateResult.output ? dateResult.output : 'unknown date'
            changelog.append("## ${tag} (${date})\n")

            def range = index + 1 < tags.size() ? "${tags[index + 1]}..${tag}" : tag
            def subjectsResult = runGit(['log', '--format=%s', '--no-decorate', range], true)
            if (subjectsResult.exitValue == 0 && subjectsResult.output) {
                subjectsResult.output.readLines()
                        .findAll { !it.trim().isEmpty() }
                        .take(20)
                        .each { subject -> changelog.append("- ${subject}\n") }
            }
            changelog.append('\n')
        }
        outputFile.setText(changelog.toString(), 'UTF-8')
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('generateChangelog')
}

// Workflows consume this single deterministic source of truth instead of reimplementing version logic.
tasks.register('writeVersionInfo') {
    inputs.property('versionCode', gitVersionCode)
    inputs.property('versionName', gitVersionName)
    inputs.property('gitHash', gitHash)
    outputs.file(versionInfoFile)
    doLast {
        def outputFile = versionInfoFile.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.setText(JsonOutput.toJson([
                versionCode: gitVersionCode,
                versionName: gitVersionName,
                gitHash    : gitHash
        ]) + '\n', 'UTF-8')
    }
}

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'

    doFirst {
        delete reports.html.outputLocation
    }

    reports {
        xml.required = true
        html.required = true
        csv.required = false
        xml.outputLocation = file("${buildDir}/reports/jacoco/jacocoTestReport.xml")
        html.outputLocation = file("${buildDir}/reports/jacoco/html")
    }

    def fileFilter = [
            '**/R.class',
            '**/R$*.class',
            '**/BuildConfig.*',
            '**/Manifest*.*',
            '**/*Test*.*',
            'android/**/*.*',
            '**/*$Lambda$*.*',
            '**/*$inlined$*.*'
    ]

    def javaClasses = fileTree(dir: "${buildDir}/intermediates/javac/debug/compileDebugJavaWithJavac/classes", excludes: fileFilter)
    def kotlinClasses = fileTree(dir: "${buildDir}/tmp/kotlin-classes/debug", excludes: fileFilter)
    def mainSrc = "${project.projectDir}/src/main/java"

    sourceDirectories.from = files([mainSrc])
    classDirectories.from = files([javaClasses, kotlinClasses])
    executionData.from = fileTree(dir: buildDir, includes: [
            'outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec',
            'jacoco/testDebugUnitTest.exec'
    ])
}

// 覆盖率门禁：当前值 指令 83% / 行 78.6%（-PexcludeExtendedUiTests 口径），阈值随提升逐步收紧。
tasks.register('jacocoTestCoverageVerification', JacocoCoverageVerification) {
    dependsOn 'jacocoTestReport'

    def fileFilter = [
            '**/R.class',
            '**/R$*.class',
            '**/BuildConfig.*',
            '**/Manifest*.*',
            '**/*Test*.*',
            'android/**/*.*',
            '**/*$Lambda$*.*',
            '**/*$inlined$*.*'
    ]
    def javaClasses = fileTree(dir: "${buildDir}/intermediates/javac/debug/compileDebugJavaWithJavac/classes", excludes: fileFilter)
    def kotlinClasses = fileTree(dir: "${buildDir}/tmp/kotlin-classes/debug", excludes: fileFilter)

    sourceDirectories.from = files(["${project.projectDir}/src/main/java"])
    classDirectories.from = files([javaClasses, kotlinClasses])
    executionData.from = fileTree(dir: buildDir, includes: [
            'outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec',
            'jacoco/testDebugUnitTest.exec'
    ])

    violationRules {
        rule {
            limit {
                counter = 'INSTRUCTION'
                minimum = 0.80
            }
            limit {
                counter = 'LINE'
                minimum = 0.75
            }
        }
    }
}
