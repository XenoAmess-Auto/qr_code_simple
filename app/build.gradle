    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.vintage.engine
    // AGP 9 built-in Kotlin no longer injects the JUnit Platform launcher that the removed
    // kotlin-android plugin used to add for useJUnitPlatform(); declare it explicitly.
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.robolectric
    testImplementation libs.androidx.test.core
    testImplementation libs.androidx.test.runner
    testImplementation libs.androidx.test.ext.junit
    testImplementation libs.espresso.core
    testImplementation libs.espresso.contrib
    testImplementation libs.androidx.fragment.testing
    debugImplementation libs.androidx.fragment.testing

    // Instrumented tests (androidTest，模拟器/真机)
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.rules
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.espresso.contrib
    androidTestImplementation libs.androidx.test.core
    // fragment-testing 会把 androidx.test:core 1.5.0 带进 debug 运行时，
    // 与 androidTest 的 1.7.0 冲突；统一抬到 1.7.0（仅 debug 构建，不进 release）。
    debugImplementation libs.androidx.test.core

    // Baseline Profile 运行时安装器
    implementation libs.androidx.profileinstaller
    baselineProfile project(':baselineprofile')
}

// Package release history with the app without mutating source assets.
tasks.register('generateChangelog') {
    // Capture at configuration time: the configuration cache forbids touching the script
    // object from a task action during execution.
    def projectProviders = providers
    def projectRootDir = rootProject.projectDir
    outputs.file(changelogFile)
    // Git refs are external task inputs and can change without source changes.
    outputs.upToDateWhen { false }
    doLast {
        def outputFile = changelogFile.get().asFile
        outputFile.parentFile.mkdirs()

        // Local runner created at execution time so the configuration cache never has to
        // serialize a script-level closure captured by this task action.
        def gitRun = { List<String> args, boolean allow = false ->
            def exec = projectProviders.exec {
                workingDir projectRootDir
                commandLine(*(['git'] + args))
                ignoreExitValue = true
            }
            def out = exec.standardOutput.asText.get().trim()
            def err = exec.standardError.asText.get().trim()
            [exitValue: exec.result.get().exitValue, output: out, error: err]
        }

        def tagsResult = gitRun(['tag', '-l', 'v*', '--sort=-creatordate'], true)
        def tags = tagsResult.exitValue == 0
                ? tagsResult.output.readLines().findAll { !it.trim().isEmpty() }
                : []
        if (tags.isEmpty()) {
            outputFile.setText('No matching v* tags are available in this repository.\n', 'UTF-8')
            return
        }

        def changelog = new StringBuilder()
        tags.eachWithIndex { String tag, int index ->
            def dateResult = gitRun(['log', '-1', '--format=%cs', tag], true)
            def date = dateResult.exitValue == 0 && dateResult.output ? dateResult.output : 'unknown date'
            changelog.append("## ${tag} (${date})\n")

            def range = index + 1 < tags.size() ? "${tags[index + 1]}..${tag}" : tag
            def subjectsResult = gitRun(['log', '--format=%s', '--no-decorate', range], true)
            if (subjectsResult.exitValue == 0 && subjectsResult.output) {
                subjectsResult.output.readLines()
                        .findAll { !it.trim().isEmpty() }
                        .take(20)
                        .each { subject -> changelog.append("- ${subject}\n") }
            }
            changelog.append('\n')
        }
        outputFile.setText(changelog.toString(), 'UTF-8')
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('generateChangelog')
}

// Workflows consume this single deterministic source of truth instead of reimplementing version logic.
tasks.register('writeVersionInfo') {
    inputs.property('versionCode', gitVersionCode)
    inputs.property('versionName', gitVersionName)
    inputs.property('gitHash', gitHash)
    outputs.file(versionInfoFile)
    doLast {
        def outputFile = versionInfoFile.get().asFile
        outputFile.parentFile.mkdirs()
        outputFile.setText(JsonOutput.toJson([
                versionCode: gitVersionCode,
                versionName: gitVersionName,
                gitHash    : gitHash
        ]) + '\n', 'UTF-8')
    }
}

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'
    // Capture at configuration time: the configuration cache forbids script-object access
    // (project.delete) from a task action during execution.
    def projectLayout = layout

    doFirst {
        projectLayout.buildDirectory.dir('reports/jacoco/html').get().asFile.deleteDir()
    }

    reports {
        xml.required = true
        html.required = true
        csv.required = false
        xml.outputLocation = file("${buildDir}/reports/jacoco/jacocoTestReport.xml")
        html.outputLocation = file("${buildDir}/reports/jacoco/html")
    }

    def fileFilter = [
            '**/R.class',
            '**/R$*.class',
            '**/BuildConfig.*',
            '**/Manifest*.*',
            '**/*Test*.*',
            '**/databinding/**',
            '**/*_Impl*.*',
            'android/**/*.*',
            '**/*$Lambda$*.*',
            '**/*$inlined$*.*'
    ]

    def javaClasses = fileTree(dir: "${buildDir}/intermediates/javac/debug/compileDebugJavaWithJavac/classes", excludes: fileFilter)
    def kotlinClasses = fileTree(dir: "${buildDir}/intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes", excludes: fileFilter)
    def mainSrc = "${project.projectDir}/src/main/java"

    sourceDirectories.from = files([mainSrc])
    classDirectories.from = files([javaClasses, kotlinClasses])
    executionData.from = fileTree(dir: buildDir, includes: [
            'outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec',
            'jacoco/testDebugUnitTest.exec'
    ])
}

// 覆盖率门禁：当前值 指令 80.9% / 行 77.1%（-PexcludeExtendedUiTests 口径），阈值随提升逐步收紧。
tasks.register('jacocoTestCoverageVerification', JacocoCoverageVerification) {
    dependsOn 'jacocoTestReport'

    def fileFilter = [
            '**/R.class',
            '**/R$*.class',
            '**/BuildConfig.*',
            '**/Manifest*.*',
            '**/*Test*.*',
            '**/databinding/**',
            '**/*_Impl*.*',
            'android/**/*.*',
            '**/*$Lambda$*.*',
            '**/*$inlined$*.*'
    ]
    def javaClasses = fileTree(dir: "${buildDir}/intermediates/javac/debug/compileDebugJavaWithJavac/classes", excludes: fileFilter)
    def kotlinClasses = fileTree(dir: "${buildDir}/intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes", excludes: fileFilter)

    sourceDirectories.from = files(["${project.projectDir}/src/main/java"])
    classDirectories.from = files([javaClasses, kotlinClasses])
    executionData.from = fileTree(dir: buildDir, includes: [
            'outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec',
            'jacoco/testDebugUnitTest.exec'
    ])

    violationRules {
        rule {
            limit {
                counter = 'INSTRUCTION'
                minimum = 0.80
            }
            limit {
                counter = 'LINE'
                minimum = 0.76
            }
            limit {
                counter = 'BRANCH'
                minimum = 0.60
            }
        }
    }
}
