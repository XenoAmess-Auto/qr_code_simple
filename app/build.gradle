def isFdroid = project.hasProperty('fdroid')

android {
    namespace 'com.xenoamess.qrcodesimple'
    compileSdk 35
    testBuildType project.hasProperty('releaseInstrumentedTest') ? 'release' : 'debug'

    defaultConfig {
        applicationId "com.xenoamess.qrcodesimple"
        minSdk 28
        targetSdk 35
        versionCode gitVersionCode
        versionName gitVersionName
        buildConfigField "String", "GIT_HASH", "\"${gitHash}\""
        // F-Droid 构建（-Pfdroid）：剔除上游预编译 libapkpatch.so / libc++_shared.so，
        // 自更新增量补丁随之缺席（完整下载路径也不可用——F-Droid 签名与本仓库基线不同），
        // 同时隐藏应用内更新入口。
        buildConfigField "boolean", "IS_FDROID", "${isFdroid}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Release 签名：优先取环境变量，其次 gradle 属性（如 ~/.gradle/gradle.properties）。
        // 未配置时 release 构建回退到 debug 签名，保证本地/外部贡献者构建可用。
        release {
            def ksFile = System.getenv("RELEASE_KEYSTORE_FILE") ?: (project.findProperty("RELEASE_KEYSTORE_FILE") as String)
            if (ksFile != null) {
                storeFile file(ksFile)
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD") ?: (project.findProperty("RELEASE_KEYSTORE_PASSWORD") as String)
                keyAlias System.getenv("RELEASE_KEYSTORE_ALIAS") ?: (project.findProperty("RELEASE_KEYSTORE_ALIAS") as String)
                keyPassword System.getenv("RELEASE_KEYSTORE_PASSWORD") ?: (project.findProperty("RELEASE_KEYSTORE_PASSWORD") as String)
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            testCoverage {
                enableUnitTestCoverage = false
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (project.hasProperty('releaseInstrumentedTest')) {
                proguardFile 'proguard-release-test-rules.pro'
            }
            signingConfig signingConfigs.release.storeFile != null ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
        coreLibraryDesugaringEnabled false
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    sourceSets {
        main {
            assets.srcDir(changelogAssetsDir.get().asFile)
            // F-Droid：真实 ML Kit 引擎（src/playstore）不参与编译，由 fdroid 源集的 stub 顶替
            def variantSrc = isFdroid ? 'src/fdroid/java' : 'src/playstore/java'
            java.srcDirs += variantSrc
            kotlin.srcDirs += variantSrc
        }
    }
    lint {
        // 存量问题（主要是历史翻译债务）记录在 baseline 中；
        // 新增 issue（如新增未翻译字符串）会使 lintDebug 失败。
        baseline = file("lint-baseline.xml")
        // Dependabot owns version discovery; online update checks make otherwise identical lint runs non-deterministic.
        disable += ['GradleDependency', 'NewerVersionAvailable']
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                it.useJUnitPlatform()
                // 大位图测试（4000x4000+）在加载全部测试类后可能超出默认堆
                it.maxHeapSize = "2g"
                it.jacoco {
                    includeNoLocationClasses = true
                    excludes = ['jdk.internal.reflect.*']
                }
                it.filter {
                    if (project.hasProperty('excludeExtendedUiTests')) {
                        // 本地/CI 常规验证时排除长耗时测试：扩展 UI 测试 + 样式回扫矩阵
                        excludeTestsMatching '*GenerateFragmentExtendedUiTest*'
                        excludeTestsMatching '*StyleRawRoundtripMatrixTest*'
                    }
                }
                it.addTestListener(new GlobalTestLogger())
                testLogging {
                    showStandardStreams = true
                }
                systemProperty 'robolectric.logging', 'stdout'
            }
        }
    }
    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libc++_shared.so']
            if (isFdroid) {
                excludes += ['**/libapkpatch.so', '**/libc++_shared.so']
            }
        }
    }
}

